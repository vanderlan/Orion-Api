services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5010:80"
    container_name: orion-api
    depends_on:
#if (systemDatabase == SqlServer)
      - sqlserver
#else
      - postgresql
#endif
    networks:
      - backend-network
#if (systemDatabase == SqlServer)
  sqlserver:
    container_name: sqlserver
    image: mcr.microsoft.com/mssql/server:2019-latest
    restart: unless-stopped
    environment:
      SA_PASSWORD: "CHANGE_ME_Passw0rd!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    networks:
      - backend-network
    
  mssqltools:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      - sqlserver
    volumes:
      - ./scripts/initial-script.sql:/tmp/initial-script.sql
      - ./scripts/init-sqlserver.sh:/tmp/init-sqlserver.sh
    command: /bin/bash ./tmp/init-sqlserver.sh
    networks:
      - backend-network  
#else
  postgresql:
    container_name: postgresql
    image: postgres:16.3
    restart: unless-stopped
    hostname: postgresql
    environment:
      POSTGRES_DB: OrionDev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "CHANGE_ME_Passw0rd!"
    ports:
      - "5432:5432"
    networks:
        - backend-network
#endif

networks:
    backend-network:
        driver: bridge
  