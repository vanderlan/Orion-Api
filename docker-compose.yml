services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5010:8080"
    container_name: orion-api
    environment:
      # Traces, metrics and logs are sent to the Aspire dashboard (http://localhost:18888).
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "orion-api"
    depends_on:
      - aspire-dashboard
#if (systemDatabase == SqlServer)
      - sqlserver
#elseif (systemDatabase == PostgreSql)
      - postgresql
#else
      - mongodb
#endif
    networks:
      - backend-network
#if (systemDatabase == SqlServer)
  sqlserver:
    container_name: sqlserver
    image: mcr.microsoft.com/mssql/server:2019-latest
    restart: unless-stopped
    environment:
      SA_PASSWORD: "CHANGE_ME_Passw0rd!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    networks:
      - backend-network
    
  mssqltools:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      - sqlserver
    volumes:
      - ./scripts/initial-script.sql:/tmp/initial-script.sql
      - ./scripts/init-sqlserver.sh:/tmp/init-sqlserver.sh
    command: /bin/bash ./tmp/init-sqlserver.sh
    networks:
      - backend-network  
#elseif (systemDatabase == PostgreSql)
  postgresql:
    container_name: postgresql
    image: postgres:16.3
    restart: unless-stopped
    hostname: postgresql
    environment:
      POSTGRES_DB: OrionDev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "CHANGE_ME_Passw0rd!"
    ports:
      - "5432:5432"
    networks:
        - backend-network
#else
  mongodb:
    container_name: mongodb
    image: mongo:7.0
    restart: unless-stopped
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: "CHANGE_ME_Passw0rd!"
      MONGO_INITDB_DATABASE: OrionDev
    ports:
      - "27017:27017"
    networks:
        - backend-network
#endif

  # Standalone .NET Aspire dashboard: OpenTelemetry UI for local development (no Aspire SDK required).
  aspire-dashboard:
    container_name: aspire-dashboard
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    restart: unless-stopped
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"   # UI
      - "18889:18889"   # OTLP/gRPC ingestion
    networks:
      - backend-network

networks:
    backend-network:
        driver: bridge
 