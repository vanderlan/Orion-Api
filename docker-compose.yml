services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5010:80"
    container_name: orion-api
    depends_on:
#if (systemDatabase == SqlServer)
      - sqlserver
#elseif (systemDatabase == PostgreSql)
      - postgresql
#else
      - mongodb
#endif
    networks:
      - backend-network
#if (systemDatabase == SqlServer)
  sqlserver:
    container_name: sqlserver
    image: mcr.microsoft.com/mssql/server:2019-latest
    restart: unless-stopped
    environment:
      SA_PASSWORD: "CHANGE_ME_Passw0rd!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    networks:
      - backend-network
    
  mssqltools:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      - sqlserver
    volumes:
      - ./scripts/initial-script.sql:/tmp/initial-script.sql
      - ./scripts/init-sqlserver.sh:/tmp/init-sqlserver.sh
    command: /bin/bash ./tmp/init-sqlserver.sh
    networks:
      - backend-network  
#elseif (systemDatabase == PostgreSql)
  postgresql:
    container_name: postgresql
    image: postgres:16.3
    restart: unless-stopped
    hostname: postgresql
    environment:
      POSTGRES_DB: OrionDev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "CHANGE_ME_Passw0rd!"
    ports:
      - "5432:5432"
    networks:
        - backend-network
#else
  mongodb:
    container_name: mongodb
    image: mongo:7.0
    restart: unless-stopped
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: "CHANGE_ME_Passw0rd!"
      MONGO_INITDB_DATABASE: OrionDev
    ports:
      - "27017:27017"
    networks:
        - backend-network
#endif

networks:
    backend-network:
        driver: bridge
 